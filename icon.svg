<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="36" fill="#0a1f1a"/>

  <!-- Ball -->
  <circle cx="56" cy="140" r="22" fill="#e07b35"/>
  <path d="M56 118 a22 22 0 0 1 0 44" stroke="#a0461c" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Bat: handle in orange, splice in brown, blade in cream -->
  <g transform="translate(118 96) rotate(45)">
    <!-- Blade -->
    <rect x="-14" y="-20" width="28" height="76" rx="6" fill="#f5e6c8"/>
    <line x1="0" y1="-10" x2="0" y2="50" stroke="#d9c7a0" stroke-width="1.5"/>

    <!-- Splice (V-shape where handle meets blade) -->
    <polygon points="-14,-18 14,-18 10,-30 -10,-30" fill="#a55a26"/>

    <!-- Handle -->
    <rect x="-7" y="-66" width="14" height="38" rx="5" fill="#e07b35"/>
    <!-- Grip rings -->
    <line x1="-7" y1="-58" x2="7" y2="-58" stroke="#9c4517" stroke-width="1.4"/>
    <line x1="-7" y1="-50" x2="7" y2="-50" stroke="#9c4517" stroke-width="1.4"/>
    <line x1="-7" y1="-42" x2="7" y2="-42" stroke="#9c4517" stroke-width="1.4"/>
    <line x1="-7" y1="-34" x2="7" y2="-34" stroke="#9c4517" stroke-width="1.4"/>
  </g>
</svg>
